name: CD

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Doppler configs:
  #   ci   — Docker Hub + deploy SSH (DOPPLER_CICD_SERVICE_TOKEN, config-scoped)
  #   prod — app/runtime secrets on VPS (DOPPLER_SERVICE_TOKEN, config-scoped)
  DOPPLER_PROJECT: chess-teacher
  DOPPLER_CONFIG_CI: ci
  DOPPLER_CONFIG_PROD: prod

jobs:
  # ---------------------------------------------------------------------------
  # Bump version on develop (reads label from the PR that triggered this push)
  # ---------------------------------------------------------------------------
  bump-version:
    runs-on: ubuntu-latest
    if: github.ref_name == 'develop'
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.VERSION_BUMP_PAT }}
          fetch-depth: 0

      - name: Get bump label from merged PR
        id: label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(git log -1 --pretty=%B | grep -oP '(?<=#)\d+' | head -1)

          if [ -z "$PR_NUMBER" ]; then
            echo "Could not extract PR number from commit message — skipping bump."
            echo "bump=none" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "PR number: #$PR_NUMBER"

          LABELS=$(gh pr view $PR_NUMBER --json labels --jq '.labels[].name')
          echo "Labels found: $LABELS"

          if echo "$LABELS" | grep -q "bump:major"; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "bump:minor"; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "bump:patch"; then
            echo "bump=patch" >> $GITHUB_OUTPUT
          else
            echo "bump=none" >> $GITHUB_OUTPUT
            echo "No bump label found — skipping version bump."
          fi

      - name: Bump version in pyproject.toml
        id: bump
        if: steps.label.outputs.bump != 'none'
        run: |
          CURRENT=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT"

          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          case "${{ steps.label.outputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"

          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and tag new version
        if: steps.label.outputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}-dev"
          git push origin develop --follow-tags

      - name: Output current version (no bump)
        if: steps.label.outputs.bump == 'none'
        id: current
        run: |
          CURRENT=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Read version on main (no bump — inherits from develop)
  # ---------------------------------------------------------------------------
  read-version:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    outputs:
      version: ${{ steps.read.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: read
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Tag release on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.read.outputs.version }}"
          git push origin "v${{ steps.read.outputs.version }}"

  # ---------------------------------------------------------------------------
  # Build and push Docker image
  # ---------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: [bump-version, read-version]
    if: |
      always() &&
      (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') &&
      (needs.read-version.result == 'success' || needs.read-version.result == 'skipped')
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve version
        id: version
        run: |
          VERSION=${{ needs.bump-version.outputs.version || needs.read-version.outputs.version }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Load Docker Hub credentials from Doppler
        id: doppler_dockerhub
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_CICD_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "Missing GitHub secret DOPPLER_CICD_SERVICE_TOKEN in this environment."
            exit 1
          fi
          username="$(doppler secrets get DOCKERHUB_USERNAME \
            --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG_CI" --plain)"
          token="$(doppler secrets get DOCKERHUB_TOKEN \
            --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG_CI" --plain)"
          echo "::add-mask::$token"
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.doppler_dockerhub.outputs.username }}
          password: ${{ steps.doppler_dockerhub.outputs.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.doppler_dockerhub.outputs.username }}/chess_teacher
          tags: |
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=v${{ steps.version.outputs.version }}-dev,enable=${{ github.ref_name == 'develop' }}
            type=sha,format=short,prefix=develop-,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=v${{ steps.version.outputs.version }},enable=${{ github.ref_name == 'main' }}
            type=sha,format=short,prefix=main-,enable=${{ github.ref_name == 'main' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # Deploy (main only — SCP manifests + SSH apply on Hetzner)
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      github.ref_name == 'main'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deploy image
        id: image
        run: echo "tag=main-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Load CI/deploy secrets from Doppler
        id: doppler_ci
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_CICD_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "Missing GitHub secret DOPPLER_CICD_SERVICE_TOKEN in production environment."
            exit 1
          fi
          fetch() {
            doppler secrets get "$1" --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG_CI" --plain
          }
          host="$(fetch DEPLOY_HOST)"
          user="$(fetch DEPLOY_USER)"
          key="$(fetch DEPLOY_SSH_KEY)"
          dockerhub_username="$(fetch DOCKERHUB_USERNAME)"
          echo "::add-mask::$key"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "dockerhub_username=$dockerhub_username" >> "$GITHUB_OUTPUT"
          {
            echo "ssh_key<<EOF"
            echo "$key"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Copy k8s manifests to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ steps.doppler_ci.outputs.host }}
          username: ${{ steps.doppler_ci.outputs.user }}
          key: ${{ steps.doppler_ci.outputs.ssh_key }}
          source: orchestration/k8s/
          target: /opt/chess_teacher/
          strip_components: 1
          rm: true

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
        with:
          host: ${{ steps.doppler_ci.outputs.host }}
          username: ${{ steps.doppler_ci.outputs.user }}
          key: ${{ steps.doppler_ci.outputs.ssh_key }}
          envs: DOPPLER_TOKEN
          script: |
            set -euo pipefail
            if ! command -v doppler >/dev/null 2>&1; then
              echo "ERROR: Doppler CLI not found on VPS. Install it first:"
              echo "  (curl -Ls --tlsv1.2 --proto \"=https\" --retry 3 https://cli.doppler.com/install.sh || wget -t 3 -qO- https://cli.doppler.com/install.sh) | sudo sh"
              exit 1
            fi
            export IMAGE="${{ steps.doppler_ci.outputs.dockerhub_username }}/chess_teacher:${{ steps.image.outputs.tag }}"
            export IMAGE_PULL_POLICY=Always
            export ENVIRONMENT=PROD
            doppler run \
              --token "$DOPPLER_TOKEN" \
              --project "${{ env.DOPPLER_PROJECT }}" \
              --config "${{ env.DOPPLER_CONFIG_PROD }}" \
              -- bash /opt/chess_teacher/k8s/apply.sh
