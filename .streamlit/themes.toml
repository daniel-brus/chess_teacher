# Built-in palettes when no named theme is selected ([generic.*]).
# Named themes are grouped by Streamlit appearance (light menu vs dark menu).

[generic.light]
label = "Built-in"
tile_light = "#FAFAFA"
tile_dark = "#E8E8E8"
divider = "rgba(49, 51, 63, 0.25)"

[generic.dark]
label = "Built-in"
tile_light = "#1A1D24"
tile_dark = "#262730"
divider = "rgba(250, 250, 250, 0.2)"

