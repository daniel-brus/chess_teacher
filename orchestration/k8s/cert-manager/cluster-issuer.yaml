# Let's Encrypt ClusterIssuer for Traefik HTTP-01 challenges.
# CERT_MANAGER_ACME_EMAIL_PLACEHOLDER is substituted by apply.sh from CERT_MANAGER_ACME_EMAIL.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: CERT_MANAGER_ACME_EMAIL_PLACEHOLDER
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: traefik
