apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-maintenance
  namespace: chess-teacher
spec:
  # Four baseline trains, in the gaps between user crons
  # (00:30, 03:00, 04:00, 13:30 Europe/Amsterdam).
  schedule: "0 5,11,17,23 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: maintenance
              image: IMAGE_PLACEHOLDER
              imagePullPolicy: IMAGE_PULL_POLICY_PLACEHOLDER
              command: ["python", "scripts/entrypoints/maintenance.py"]
              envFrom:
                - secretRef:
                    name: chess-teacher-env
              env:
                - name: ENVIRONMENT
                  valueFrom:
                    configMapKeyRef:
                      name: chess-teacher-config
                      key: ENVIRONMENT
                - name: BASELINE_NIGHTLY_ROUNDS
                  value: "1"
                - name: HOSTNAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
