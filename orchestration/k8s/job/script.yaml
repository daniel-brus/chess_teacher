# One-off script Job template (entrypoints or ops under scripts/).
#
# Prefer the VPS wrapper (deployed by CD next to this file):
#
#   /opt/chess_teacher/k8s/run-script-job.sh baseline_training
#   /opt/chess_teacher/k8s/run-script-job.sh backfill_candidate_evals -- --workers 4
#
# From a repo checkout with kubectl:
#
#   python scripts/utils/run_script_job.py baseline_training --dry-run
#   python scripts/utils/run_script_job.py ops/backfill_candidate_evals.py -- --workers 4
#
# Placeholders:
#   REPLACE_JOB_NAME            — unique Job name
#   REPLACE_SCRIPT_JOB_IMAGE    — container image
#   REPLACE_IMAGE_PULL_POLICY   — IfNotPresent or Always
#   REPLACE_SCRIPT_PATH         — path under scripts/, e.g. entrypoints/baseline_training.py
#   REPLACE_SCRIPT_LABEL        — basename for k8s labels (no slashes), e.g. baseline_training.py
#   REPLACE_SCRIPT_ARGS         — YAML list, e.g. [] or ["--workers", "4"]
#
# Optional v1.1: add resources.requests/limits for CPU-heavy backfill (--workers 4).
apiVersion: batch/v1
kind: Job
metadata:
  name: REPLACE_JOB_NAME
  namespace: chess-teacher
  labels:
    app: chess-teacher
    chess-teacher.io/job-type: script
    chess-teacher.io/script: REPLACE_SCRIPT_LABEL
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: chess-teacher
        chess-teacher.io/job-type: script
        chess-teacher.io/script: REPLACE_SCRIPT_LABEL
    spec:
      restartPolicy: Never
      containers:
        - name: script
          image: REPLACE_SCRIPT_JOB_IMAGE
          imagePullPolicy: REPLACE_IMAGE_PULL_POLICY
          command: ["python", "scripts/REPLACE_SCRIPT_PATH"]
          args: REPLACE_SCRIPT_ARGS
          envFrom:
            - secretRef:
                name: chess-teacher-env
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: chess-teacher-config
                  key: ENVIRONMENT
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
