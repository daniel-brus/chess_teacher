# One-off script Job template (long-lived prod ops: backfill, baseline reset/train).
#
# scripts/run_script_job.py loads this file and substitutes REPLACE_* placeholders.
# Manual smoke test: replace placeholders, then kubectl apply -f this file.
#
#   export PIPELINE_JOB_IMAGE="$(kubectl get deploy streamlit -n chess-teacher \
#     -o jsonpath='{.spec.template.spec.containers[0].image}')"
#   # edit placeholders below, then:
#   kubectl delete job script-backfill-manual -n chess-teacher --ignore-not-found
#   kubectl apply -f orchestration/k8s/job/script.yaml
#   kubectl logs -n chess-teacher job/script-backfill-manual -f
#
# Examples (from repo checkout on VPS with kubectl + kubeconfig):
#
#   python scripts/run_script_job.py backfill_candidate_evals -- --workers 4
#   python scripts/run_script_job.py baseline_reset_training -- --yes
#   python scripts/run_script_job.py baseline_train_until_caught_up
#
# Placeholders:
#   REPLACE_JOB_NAME            — unique Job name (CLI generates per run)
#   REPLACE_SCRIPT_JOB_IMAGE    — container image (PIPELINE_JOB_IMAGE / streamlit tag)
#   REPLACE_IMAGE_PULL_POLICY   — IfNotPresent or Always
#   REPLACE_SCRIPT_BASENAME     — e.g. backfill_candidate_evals.py (whitelist only)
#   REPLACE_SCRIPT_ARGS         — YAML list, e.g. [] or ["--workers", "4"]
#
# Optional v1.1: add resources.requests/limits for CPU-heavy backfill (--workers 4).
apiVersion: batch/v1
kind: Job
metadata:
  name: REPLACE_JOB_NAME
  namespace: chess-teacher
  labels:
    app: chess-teacher
    chess-teacher.io/job-type: script
    chess-teacher.io/script: REPLACE_SCRIPT_BASENAME
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: chess-teacher
        chess-teacher.io/job-type: script
        chess-teacher.io/script: REPLACE_SCRIPT_BASENAME
    spec:
      restartPolicy: Never
      containers:
        - name: script
          image: REPLACE_SCRIPT_JOB_IMAGE
          imagePullPolicy: REPLACE_IMAGE_PULL_POLICY
          command: ["python", "scripts/REPLACE_SCRIPT_BASENAME"]
          args: REPLACE_SCRIPT_ARGS
          envFrom:
            - secretRef:
                name: chess-teacher-env
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: chess-teacher-config
                  key: ENVIRONMENT
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
