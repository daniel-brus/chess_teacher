# Host Postgres for Hetzner VPS (outside k3s).
# Same image/env contract as local docker-compose.infra.yml.
# Usage on VPS:
#   cd /opt/chess_teacher/infra
#   docker compose --env-file postgres.env -f docker-compose.postgres.yml up -d
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      # Reachable from k3s pods via the node IP; firewall must not open 5432 to the world.
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_DIR:-/var/lib/chess_teacher/postgres}:/var/lib/postgresql/data
    # Args are passed through the official image entrypoint (init still runs).
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
