tables:
  baseline_models:
    schema: ml
    table: baseline_models
    comment: Incremental baseline model candidates and production checkpoints
    primary_key:
      - id
    indexes:
      - name: idx_baseline_models_status
        columns: [status]
      - name: idx_baseline_models_version
        columns: [version]
      - name: idx_baseline_models_parent_baseline
        columns: [is_parent_baseline]
    columns:
      - name: id
        data_type: text
        nullable: false
        comment: Hashed ID from version
      - name: version
        data_type: text
        nullable: false
        comment: Monotonic version label (e.g. v12)
      - name: mlflow_run_id
        data_type: text
        nullable: true
        comment: MLflow run id for this training session
      - name: model_uri
        data_type: text
        nullable: true
        comment: Artifact URI / S3 key for model weights
      - name: status
        data_type: text
        nullable: false
        default: "candidate"
        comment: candidate | production | archived
      - name: is_parent_baseline
        data_type: boolean
        nullable: false
        default: false
        comment: True only for the platform model that personal runs warm-start from after a parent reset. Independent of production status.
      - name: parent_version
        data_type: text
        nullable: true
        comment: Previous candidate version this was finetuned from
      - name: data_cutoff_at
        data_type: timestamptz
        nullable: true
        comment: Max games.end_time included in this training batch
      - name: trained_at
        data_type: timestamptz
        nullable: false
        comment: When this row was written
      - name: eval_metrics
        data_type: text
        nullable: true
        comment: JSON metrics blob (held-out eval later)
      - name: git_commit_hash
        data_type: text
        nullable: true
        comment: Git commit at train time if available

  personal_models:
    schema: ml
    table: personal_models
    comment: Per-user finetune candidates and the model currently served for that user
    primary_key:
      - id
    indexes:
      - name: idx_personal_models_user_status
        columns: [user_id, status]
    columns:
      - name: id
        data_type: text
        nullable: false
        comment: Hashed ID from user_id and version
      - name: user_id
        data_type: text
        nullable: false
        comment: User whose linked accounts' registry-train moves produced this row
      - name: version
        data_type: text
        nullable: false
        comment: Per-user monotonic version label (e.g. v3)
      - name: mlflow_run_id
        data_type: text
        nullable: true
        comment: MLflow run id for this training session
      - name: model_uri
        data_type: text
        nullable: true
        comment: Artifact URI / S3 key for model weights
      - name: status
        data_type: text
        nullable: false
        default: "candidate"
        comment: candidate | production | archived
      - name: parent_version
        data_type: text
        nullable: true
        comment: Version key of the weights this run warm-started from
      - name: parent_kind
        data_type: text
        nullable: true
        comment: baseline or personal, matching the parent handle kind
      - name: parent_baseline_version
        data_type: text
        nullable: true
        comment: Platform baseline version this model descends from. Copied forward when a personal run warm-starts from another personal model.
      - name: trained_at
        data_type: timestamptz
        nullable: false
        comment: When this row was written
      - name: eval_metrics
        data_type: text
        nullable: true
        comment: JSON metrics blob (train metrics plus registry-val scores)
      - name: git_commit_hash
        data_type: text
        nullable: true
        comment: Git commit at train time if available

  training_state:
    schema: ml
    table: training_state
    comment: Per-chain bookkeeping for incremental training cutoffs
    primary_key:
      - scope
    columns:
      - name: scope
        data_type: text
        nullable: false
        comment: baseline or user:{user_id}
      - name: last_trained_data_cutoff
        data_type: timestamptz
        nullable: true
        comment: Last games.end_time consumed by training
      - name: last_min_data_check_at
        data_type: timestamptz
        nullable: true
        comment: Last time the min-data gate was evaluated
      - name: personal_queue_baseline
        data_type: text
        nullable: true
        comment: Parent baseline version this user's personal queue was last aligned to. NULL means not aligned yet.

  game_split_assignments:
    schema: ml
    table: game_split_assignments
    comment: Persistent train/val/test bucket per game for a split_version (salt)
    primary_key:
      - split_version
      - game_id
    indexes:
      - name: idx_game_split_assignments_bucket
        columns: [split_version, bucket]
      - name: idx_game_split_assignments_baseline_queue
        columns: [split_version, bucket, already_processed_baseline]
      - name: idx_game_split_assignments_baseline_attempts
        columns: [split_version, bucket, already_processed_baseline, baseline_train_attempts]
      - name: idx_game_split_assignments_personal_attempts
        columns: [split_version, bucket, already_processed_personal, personal_train_attempts]
    columns:
      - name: split_version
        data_type: text
        nullable: false
        comment: Split policy label (e.g. baseline-v1); same as splits.DEFAULT_SPLIT_SALT
      - name: game_id
        data_type: text
        nullable: false
        comment: games.games primary key
      - name: bucket
        data_type: text
        nullable: false
        comment: train | val | test
      - name: assigned_at
        data_type: timestamptz
        nullable: false
        comment: When this assignment was first written
      - name: already_processed_baseline
        data_type: timestamptz
        nullable: true
        comment: NULL = not in the served baseline; set to now() when the batch that fit these games is promoted
      - name: already_processed_personal
        data_type: timestamptz
        nullable: true
        comment: NULL = not in this user's served personal model; set to now() when that batch is promoted
      - name: baseline_train_attempts
        data_type: integer
        nullable: false
        default: 0
        comment: Baseline fits that missed promotion. 0 stays at the front. 1 waits behind never-tried games. 2+ waits for new games.
      - name: personal_train_attempts
        data_type: integer
        nullable: false
        default: 0
        comment: Personal fits that missed promotion. Same ordering as baseline_train_attempts.

  training_scores:
    schema: ml
    table: training_scores
    comment: Val scores of the final model from one training run. One row per scored run, not per epoch.
    primary_key:
      - run_id
    indexes:
      - name: idx_training_scores_scored_at
        columns: [scored_at]
    columns:
      - name: run_id
        data_type: text
        nullable: false
        comment: platform.pipeline_runs.run_id for this baseline_training or personal_training run
      - name: pipeline_name
        data_type: text
        nullable: false
        comment: baseline_training or personal_training
      - name: version
        data_type: text
        nullable: false
        comment: Candidate version written for this run (e.g. v3)
      - name: model_id
        data_type: text
        nullable: false
        comment: baseline_models.id or personal_models.id of the scored candidate
      - name: scored_at
        data_type: timestamptz
        nullable: false
        comment: When these val scores were stored
      - name: n_eval
        data_type: integer
        nullable: false
        comment: Eval rows that had a usable candidate target
      - name: n_sf_agree
        data_type: integer
        nullable: false
        comment: Eval rows whose labeled move was Stockfish's best
      - name: n_sf_disagree
        data_type: integer
        nullable: false
        comment: Eval rows whose labeled move was worse than Stockfish's best
      - name: val_top1
        data_type: double precision
        nullable: false
        comment: Unweighted fraction of eval rows where the model's top move was the labeled move
      - name: val_top3
        data_type: double precision
        nullable: false
        comment: Unweighted fraction of eval rows where the labeled move was in the model's top 3
      - name: val_top1_weighted
        data_type: double precision
        nullable: false
        comment: val_top1 with the training sample weights (ply times style-disagree boost)
      - name: val_top3_weighted
        data_type: double precision
        nullable: false
        comment: val_top3 with the training sample weights (ply times style-disagree boost)
      - name: sf_delta_mean_pawns
        data_type: double precision
        nullable: false
        comment: Unweighted mean pawn gap of the model's chosen move versus Stockfish's best. 0 is the engine move. Negative is worse.
      - name: sf_delta_median_pawns
        data_type: double precision
        nullable: false
        comment: Unweighted median pawn gap of the model's chosen move versus Stockfish's best. 0 is the engine move. Negative is worse.
      - name: sf_delta_mean_pawns_weighted
        data_type: double precision
        nullable: false
        comment: Mean pawn gap versus Stockfish's best, weighted by the training sample weights
      - name: sf_delta_median_pawns_weighted
        data_type: double precision
        nullable: false
        comment: Median pawn gap versus Stockfish's best, weighted by the training sample weights. Equal weights match the unweighted median.
      - name: user_id
        data_type: text
        nullable: true
        comment: Set for personal_training. Null for the platform baseline.
      - name: val_top1_agree
        data_type: double precision
        nullable: true
        comment: val_top1 on rows where the labeled move was Stockfish's best. Null when that slice is empty.
      - name: val_top3_agree
        data_type: double precision
        nullable: true
        comment: val_top3 on the Stockfish-agree slice. Null when that slice is empty.
      - name: val_top1_disagree
        data_type: double precision
        nullable: true
        comment: val_top1 on rows where the labeled move was worse than Stockfish's best. Null when that slice is empty.
      - name: val_top3_disagree
        data_type: double precision
        nullable: true
        comment: val_top3 on the Stockfish-disagree slice. Null when that slice is empty.
      - name: val_top1_agree_weighted
        data_type: double precision
        nullable: true
        comment: Weighted val_top1 on the Stockfish-agree slice, using those rows' training weights. Null when the slice is empty.
      - name: val_top3_agree_weighted
        data_type: double precision
        nullable: true
        comment: Weighted val_top3 on the Stockfish-agree slice. Null when the slice is empty.
      - name: val_top1_disagree_weighted
        data_type: double precision
        nullable: true
        comment: Weighted val_top1 on the Stockfish-disagree slice. Null when the slice is empty.
      - name: val_top3_disagree_weighted
        data_type: double precision
        nullable: true
        comment: Weighted val_top3 on the Stockfish-disagree slice. Null when the slice is empty.

  training_slot:
    schema: ml
    table: training_slot
    comment: One global slot so only one neural training fit runs at a time.
    primary_key:
      - slot_name
    columns:
      - name: slot_name
        data_type: text
        nullable: false
        comment: Fixed name for the single machine-wide training slot.
      - name: holder_run_id
        data_type: text
        nullable: true
        comment: platform.pipeline_runs.run_id that currently holds the slot. Null when free.
      - name: acquired_at
        data_type: timestamptz
        nullable: true
        comment: When the current holder took the slot. Older than the stale window can be taken over.
