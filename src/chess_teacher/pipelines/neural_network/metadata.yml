tables:
  baseline_models:
    schema: ml
    table: baseline_models
    comment: Incremental baseline model candidates and production checkpoints
    primary_key:
      - id
    indexes:
      - name: idx_baseline_models_status
        columns: [status]
      - name: idx_baseline_models_version
        columns: [version]
      - name: idx_baseline_models_parent_baseline
        columns: [is_parent_baseline]
    columns:
      - name: id
        data_type: text
        nullable: false
        comment: Hashed ID from version
      - name: version
        data_type: text
        nullable: false
        comment: Monotonic version label (e.g. v12)
      - name: mlflow_run_id
        data_type: text
        nullable: true
        comment: MLflow run id for this training session
      - name: model_uri
        data_type: text
        nullable: true
        comment: Artifact URI / S3 key for model weights
      - name: status
        data_type: text
        nullable: false
        default: "candidate"
        comment: candidate | production | archived
      - name: is_parent_baseline
        data_type: boolean
        nullable: false
        default: false
        comment: True only for the platform model that personal runs warm-start from after a parent reset. Independent of production status.
      - name: parent_version
        data_type: text
        nullable: true
        comment: Previous candidate version this was finetuned from
      - name: data_cutoff_at
        data_type: timestamptz
        nullable: true
        comment: Max games.end_time included in this training batch
      - name: trained_at
        data_type: timestamptz
        nullable: false
        comment: When this row was written
      - name: eval_metrics
        data_type: text
        nullable: true
        comment: JSON metrics blob (held-out eval later)
      - name: git_commit_hash
        data_type: text
        nullable: true
        comment: Git commit at train time if available

  personal_models:
    schema: ml
    table: personal_models
    comment: Per-user finetune candidates and the model currently served for that user
    primary_key:
      - id
    indexes:
      - name: idx_personal_models_user_status
        columns: [user_id, status]
    columns:
      - name: id
        data_type: text
        nullable: false
        comment: Hashed ID from user_id and version
      - name: user_id
        data_type: text
        nullable: false
        comment: User whose linked accounts' registry-train moves produced this row
      - name: version
        data_type: text
        nullable: false
        comment: Per-user monotonic version label (e.g. v3)
      - name: mlflow_run_id
        data_type: text
        nullable: true
        comment: MLflow run id for this training session
      - name: model_uri
        data_type: text
        nullable: true
        comment: Artifact URI / S3 key for model weights
      - name: status
        data_type: text
        nullable: false
        default: "candidate"
        comment: candidate | production | archived
      - name: parent_version
        data_type: text
        nullable: true
        comment: Version key of the weights this run warm-started from
      - name: parent_kind
        data_type: text
        nullable: true
        comment: baseline or personal, matching the parent handle kind
      - name: parent_baseline_version
        data_type: text
        nullable: true
        comment: Platform baseline version this model descends from. Copied forward when a personal run warm-starts from another personal model.
      - name: trained_at
        data_type: timestamptz
        nullable: false
        comment: When this row was written
      - name: eval_metrics
        data_type: text
        nullable: true
        comment: JSON metrics blob (train metrics plus registry-val scores)
      - name: git_commit_hash
        data_type: text
        nullable: true
        comment: Git commit at train time if available

  training_state:
    schema: ml
    table: training_state
    comment: Per-chain bookkeeping for incremental training cutoffs
    primary_key:
      - scope
    columns:
      - name: scope
        data_type: text
        nullable: false
        comment: baseline or user:{user_id}
      - name: last_trained_data_cutoff
        data_type: timestamptz
        nullable: true
        comment: Last games.end_time consumed by training
      - name: last_min_data_check_at
        data_type: timestamptz
        nullable: true
        comment: Last time the min-data gate was evaluated

  game_split_assignments:
    schema: ml
    table: game_split_assignments
    comment: Persistent train/val/test bucket per game for a split_version (salt)
    primary_key:
      - split_version
      - game_id
    indexes:
      - name: idx_game_split_assignments_bucket
        columns: [split_version, bucket]
      - name: idx_game_split_assignments_baseline_queue
        columns: [split_version, bucket, already_processed_baseline]
    columns:
      - name: split_version
        data_type: text
        nullable: false
        comment: Split policy label (e.g. baseline-v1); same as splits.DEFAULT_SPLIT_SALT
      - name: game_id
        data_type: text
        nullable: false
        comment: games.games primary key
      - name: bucket
        data_type: text
        nullable: false
        comment: train | val | test
      - name: assigned_at
        data_type: timestamptz
        nullable: false
        comment: When this assignment was first written
      - name: already_processed_baseline
        data_type: timestamptz
        nullable: true
        comment: NULL = unprocessed for the platform baseline train queue; set to now() after a successful baseline fit
      - name: already_processed_personal
        data_type: timestamptz
        nullable: true
        comment: NULL = unprocessed for this user's current personal train chain; set to now() after a successful personal fit
