tables:
  raw_games:
    schema: games
    table: raw_games
    comment: Raw games data
    primary_key:
      - game_id
    columns:
      - name: game_id
        data_type: text
        nullable: false
        comment: Game ID in the database
      - name: platform_game_id
        data_type: text
        nullable: false
        comment: Game ID on the platform
      - name: account_id
        data_type: text
        nullable: false
        comment: Account ID of the account that the game belongs to. Can be used to obtain platform and username.

      - name: raw_pgn
        data_type: text
        nullable: false
        comment: PGN of the game, as loaded from the source API.

      # Added by ExtractGameMetadataTransformation
      - name: variant
        data_type: text
        nullable: false
        default: "standard"
        comment: Variant of the game
      - name: time_control_initial
        data_type: integer
        nullable: true
        comment: Initial time control of the game (seconds)
      - name: time_control_increment
        data_type: integer
        nullable: true
        comment: Increment of the time control of the game (seconds)
      - name: start_time
        data_type: timestamptz
        nullable: true
        comment: Start time of the game
      - name: end_time
        data_type: timestamptz
        nullable: true
        comment: End time of the game
      - name: eco_code
        data_type: text
        nullable: true
        comment: ECO code of the opening (classification)
      - name: chess_com_opening_slug
        data_type: text
        nullable: true
        comment: Chess.com openings URL slug from ECOUrl (for name lookup)

      # Added by ExtractPlayersAndResultTransformation
      - name: color
        data_type: text
        nullable: false
        comment: Color of the user in the game
      - name: result
        data_type: text
        nullable: false
        comment: Result of the game from the user's perspective
      - name: reason
        data_type: text
        nullable: false
        comment: Reason for the result
      - name: user_elo
        data_type: integer
        nullable: true
        comment: User's ELO rating at the start of the game
      - name: opponent_elo
        data_type: integer
        nullable: true
        comment: Opponent's ELO rating at the start of the game

      # Added by CleanPGNTransformation
      - name: cleaned_pgn
        data_type: text
        nullable: false
        comment: Movetext-only PGN (e.g. "1. e4 e5 2. Nf3 Nc6")

      # Added by DeriveOpeningTransformation
      - name: opening_name
        data_type: text
        nullable: true
        comment: >-
          Lichess API name, else Lichess book match (tied names joined with " | "),
          else Chess.com title from other.raw_chess_com_openings via chess_com_opening_slug.
      - name: opening_family
        data_type: text
        nullable: true
        comment: Family of the opening, derived from the opening name (e.g. "Modern Defense")
